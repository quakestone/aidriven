  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand-row">
        <div class="brand-mark">Q</div>
        <span class="brand-name">quake<span class="brand-dot">.</span>ai</span>
        <button class="icon-btn mobile-only" id="closeSidebar" aria-label="关闭导航">×</button>
      </div>
      <button class="primary-btn new-chat" id="newChat"><span>＋</span> 新建对话</button>
      <label class="search-box"><span>⌕</span><input id="searchChats" type="search" placeholder="搜索对话" /></label>
      <div class="nav-section">
        <div class="section-label">工作空间</div>
        <button class="nav-item" data-view="chat"><svg class="nav-icon" aria-hidden="true"><use href="#i-chat"/></svg> AI 对话</button>
        <button class="nav-item" data-view="skills"><svg class="nav-icon" aria-hidden="true"><use href="#i-skill"/></svg> SKILL 管理</button>
        <button class="nav-item" data-view="models"><svg class="nav-icon" aria-hidden="true"><use href="#i-model"/></svg> 模型 <span class="nav-count" id="modelCount" hidden>0</span></button>
        <button class="nav-item" data-view="adapt"><svg class="nav-icon" aria-hidden="true"><use href="#i-adapt"/></svg> 适配</button>

      <div class="sidebar-bottom">
        <button class="nav-item" id="themeToggle"><svg class="nav-icon" aria-hidden="true"><use href="#i-theme"/></svg> 切换外观</button>
        <button class="nav-item" id="installApp" hidden><svg class="nav-icon" aria-hidden="true"><use href="#i-install"/></svg> 安装到桌面</button>
        <div class="nav-version" id="installAppVersion"></div>
        <div class="user-mini">

          <div class="user-meta"><strong>本地工作区</strong><span id="statusLine">正在启动内核…</span></div>
          <span class="status-dot" id="statusDot"></span>
        </div>
      </div>

    <div class="sidebar-scrim" id="sidebarScrim"></div>
    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" id="openSidebar" aria-label="打开导航">☰</button>
          <span class="breadcrumb" id="breadcrumb">AI 对话</span>
        </div>
        <div class="topbar-actions">

          <button class="icon-btn" id="quickSettings" title="模型与 Key 设置" aria-label="设置"><svg class="nav-icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
        </div>
